name: EMERGE-KO-001

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/emerge-ko-001/**'
      - '.github/workflows/emerge-ko-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-feedback-knockout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check repository
        run: npm run lint

      - name: Run audited EMERGE-KO-001 v2
        run: |
          mkdir -p experiments/emerge-ko-001/results
          npx tsx experiments/emerge-ko-001/run-v2.ts \
            experiments/emerge-ko-001/config.example.json \
            experiments/emerge-ko-001/results/EMERGE-KO-001-v2.json

      - name: Display audited causal result
        if: always()
        run: |
          if [ -f experiments/emerge-ko-001/results/EMERGE-KO-001-v2.json ]; then
            node -e "const r=require('./experiments/emerge-ko-001/results/EMERGE-KO-001-v2.json'); console.log(JSON.stringify({gamma:r.gamma,gamma95:r.gamma95,interpretation:r.interpretation,checkpoints:r.checkpoints,cells:r.cells}, null, 2));"
          fi

      - name: Upload experiment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EMERGE-KO-001-v2-results
          path: experiments/emerge-ko-001/results/
          if-no-files-found: warn
