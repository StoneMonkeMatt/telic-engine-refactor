name: Advance mathematics through Carrier-003C

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/emerge-ko-001/advance-mathematics-003c.ts'
      - '.github/workflows/advance-mathematics-003c.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  advance-ledger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: agent/emerge-ko-001-sandbox
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify frozen ledger source
        run: |
          observed="$(git hash-object experiments/emerge-ko-001/MATHEMATICS.md)"
          test "$observed" = 'b9c8b1057d720b869ed17708154d5fe0d3c9e871'

      - name: Advance canonical ledger
        run: |
          npx tsx experiments/emerge-ko-001/advance-mathematics-003c.ts \
            experiments/emerge-ko-001/MATHEMATICS.md
          npm run lint
          grep -F 'Last updated: 17 July 2026 — after EMERGE-CARRIER-003C' \
            experiments/emerge-ko-001/MATHEMATICS.md
          grep -F '## 10. Carrier-003C Result Boundary' \
            experiments/emerge-ko-001/MATHEMATICS.md
          grep -F 'EMERGE-CARRIER-003D — Complete-Sham Native Slope Audit' \
            experiments/emerge-ko-001/MATHEMATICS.md

      - name: Commit ledger advance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/emerge-ko-001/MATHEMATICS.md
          git commit -m 'advance mathematics ledger through Carrier-003C'
          git push origin HEAD:agent/emerge-ko-001-sandbox
