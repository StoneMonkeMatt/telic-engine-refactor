name: Mathematics records check

on:
  pull_request:
    paths:
      - 'docs/mathematics-recovery/**'
      - 'scripts/verify-mathematics-records.mjs'
      - 'package.json'
      - '.github/workflows/mathematics-records-check.yml'
  push:
    paths:
      - 'docs/mathematics-recovery/**'
      - 'scripts/verify-mathematics-records.mjs'
      - 'package.json'
      - '.github/workflows/mathematics-records-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify:mathematics-records
