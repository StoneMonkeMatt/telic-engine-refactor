name: Diagnose Carrier-003D ledger markers

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/advance-mathematics-003d-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/emerge-ko-001-sandbox
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture transformer result
        run: |
          set +e
          node .github/scripts/advance-mathematics-003d.mjs \
            experiments/emerge-ko-001/MATHEMATICS.md \
            > /tmp/advance-mathematics-003d.log 2>&1
          status=$?
          echo "status=$status" >> /tmp/advance-mathematics-003d.log
          if [ "$status" -eq 0 ]; then
            git hash-object experiments/emerge-ko-001/MATHEMATICS.md \
              > experiments/emerge-ko-001/MATHEMATICS-003D-BLOB.txt
          fi
          cat /tmp/advance-mathematics-003d.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: Carrier-003D-ledger-diagnostic
          path: |
            /tmp/advance-mathematics-003d.log
            experiments/emerge-ko-001/MATHEMATICS.md
            experiments/emerge-ko-001/MATHEMATICS-003D-BLOB.txt
          if-no-files-found: warn
