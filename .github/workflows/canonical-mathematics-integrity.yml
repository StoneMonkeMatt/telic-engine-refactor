name: Canonical mathematics integrity

on:
  pull_request:
    paths:
      - 'docs/canonical/**'
      - 'scripts/verify-canonical-mathematics.mjs'
      - 'package.json'
      - '.github/workflows/canonical-mathematics-integrity.yml'
  push:
    paths:
      - 'docs/canonical/**'
      - 'scripts/verify-canonical-mathematics.mjs'
      - 'package.json'
      - '.github/workflows/canonical-mathematics-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify:canonical-mathematics
