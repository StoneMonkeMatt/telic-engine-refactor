name: EMERGE-CARRIER-003D assembly check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/emerge-carrier-003d-assembly-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --silent
      - name: Assemble base sources
        run: |
          cat experiments/emerge-ko-001/carrier-003b-runner.part00 \
              experiments/emerge-ko-001/carrier-003b-runner.part01 \
              experiments/emerge-ko-001/carrier-003b-runner.part02 \
              experiments/emerge-ko-001/carrier-003b-runner.part03 \
              experiments/emerge-ko-001/carrier-003b-runner.part04 \
              experiments/emerge-ko-001/carrier-003b-runner.part05 \
              > /tmp/runner.ts
          cat experiments/emerge-ko-001/carrier-003b-aggregate.part00 \
              experiments/emerge-ko-001/carrier-003b-aggregate.part01 \
              experiments/emerge-ko-001/carrier-003b-aggregate.part02 \
              > /tmp/aggregate.ts
      - name: Capture deterministic assembly diagnostics
        run: |
          set +e
          {
            echo '=== RUNNER ==='
            npx tsx .github/scripts/emerge-carrier-003d-runner.ts /tmp/runner.ts /tmp/runner-003d.ts
            runner_status=$?
            echo "runner_status=$runner_status"
            echo '=== AGGREGATE ==='
            npx tsx .github/scripts/emerge-carrier-003d-aggregate.ts /tmp/aggregate.ts /tmp/aggregate-003d.ts
            aggregate_status=$?
            echo "aggregate_status=$aggregate_status"
            echo "combined_status=$((runner_status || aggregate_status))"
          } > /tmp/carrier-003d-assembly-diagnostic.txt 2>&1
          cat /tmp/carrier-003d-assembly-diagnostic.txt
          exit 0
      - name: Upload assembly diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: EMERGE-CARRIER-003D-assembly-diagnostic
          path: /tmp/carrier-003d-assembly-diagnostic.txt
          if-no-files-found: error
